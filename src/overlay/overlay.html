<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
      svg { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; }
      #frame { position: fixed; inset: 0; border: 3px solid rgba(255, 59, 92, .55); border-radius: 4px; pointer-events: none; opacity: 0; transition: opacity .25s; box-shadow: inset 0 0 40px rgba(255,59,92,.18); }
      #frame.on { opacity: 1; }
      #hint { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(13,15,20,.82); color: #e7ebf3; font: 12px "Microsoft YaHei UI", sans-serif; padding: 5px 12px; border-radius: 999px; opacity: 0; transition: opacity .25s; }
      #hint.on { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="frame"></div>
    <div id="hint">ScreenLens 标注 · 按 Esc 清除</div>
    <svg id="svg"></svg>
    <script src="overlay.js"></script>
  </body>
</html>
